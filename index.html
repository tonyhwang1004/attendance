<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>출결 관리 - 김엄마독서실</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f0f4f8;--surface:#ffffff;--border:#d1dce8;--accent:#1a73e8;--accent2:#e8711a;--present:#1e9e57;--late:#e8900a;--absent:#d93025;--text:#1a2332;--muted:#6b7f99;--card:#f8fafc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(26,115,232,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(26,115,232,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
  .app{position:relative;z-index:1}
  header{background:linear-gradient(135deg,#1a73e8,#0d5bcc);border-bottom:1px solid #1560c8;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(26,115,232,.25)}
  .logo{width:42px;height:42px;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 16px rgba(255,255,255,.2)}
  h1{font-size:20px;font-weight:700;color:#fff}
  h1 span{color:#a8d4ff;font-family:'Space Mono',monospace}
  .clock{font-family:'Space Mono',monospace;font-size:12px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.2)}
  .spinner{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:16px}
  .btn{padding:8px 16px;border-radius:9px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#0d5bcc);color:#fff;box-shadow:0 3px 12px rgba(26,115,232,.3)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(26,115,232,.4)}
  .btn-green{background:#e8f5ee;color:var(--present);border:1px solid #b8dfc9}.btn-green:hover{background:#d4eddf}
  .btn-orange{background:#fff3e8;color:var(--accent2);border:1px solid #f5cfa0}.btn-orange:hover{background:#ffe8d0}
  .btn-blue{background:#e8f0fe;color:var(--accent);border:1px solid #b8d0f8}.btn-blue:hover{background:#d4e4fc}
  .btn-dim{background:#f0f4f8;color:var(--muted);border:1px solid var(--border)}.btn-dim:hover{color:var(--text);border-color:var(--accent)}
  .btn-sheet{background:#e6f4ea;color:#1e8e3e;border:1px solid #b8dfc9}.btn-sheet:hover{background:#ceead6}
  .btn-sheet:disabled{background:#f0f4f8;color:#b0bec5;border-color:#dde3ea;cursor:not-allowed}
  .btn-excel{background:#e8f0fe;color:#1a73e8;border:1px solid #b8d0f8;display:inline-flex;align-items:center;gap:6px}.btn-excel:hover{background:#d4e4fc}
  .btn-sched{background:#f3e8ff;color:#7c3aed;border:1px solid #d8b4fe;display:inline-flex;align-items:center;gap:6px}.btn-sched:hover{background:#ede0ff}
  .toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .tleft{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dselector{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 14px}
  .dselector input[type=date]{background:transparent;border:none;color:var(--text);font-size:14px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;outline:none;padding:0}
  .sched-indicator{display:none;align-items:center;gap:6px;background:#f3e8ff;border:1px solid #d8b4fe;border-radius:8px;padding:5px 12px;font-size:12px;color:#7c3aed;font-weight:600}
  .sched-indicator.active{display:flex}
  .stats{padding:18px 32px;display:flex;gap:14px;flex-wrap:wrap}
  .sc{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;transition:transform .2s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .sc:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
  .sc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
  .sc.t::after{background:linear-gradient(90deg,var(--accent),#0d5bcc)}.sc.p::after{background:var(--present)}.sc.l::after{background:var(--late)}.sc.a::after{background:var(--absent)}.sc.n::after{background:#b0bec5}
  .sl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:500}
  .sv{font-family:'Space Mono',monospace;font-size:30px;font-weight:700;line-height:1}
  .sc.t .sv{color:var(--accent)}.sc.p .sv{color:var(--present)}.sc.l .sv{color:var(--late)}.sc.a .sv{color:var(--absent)}.sc.n .sv{color:#90a4ae}
  .sp{font-size:11px;color:var(--muted);margin-top:4px;font-family:'Space Mono',monospace}
  .content{padding:0 32px 32px}
  .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .ct{font-size:15px;font-weight:600;color:var(--muted)}.ct b{color:var(--text)}
  .sb{position:relative;width:210px}
  .sb input{width:100%;background:#fff;border:1px solid var(--border);border-radius:9px;padding:8px 12px 8px 34px;color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .2s;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .sb input:focus{border-color:var(--accent)}.sb input::placeholder{color:#b0bec5}
  .sb::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:12px 16px;transition:all .2s;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;transition:background .2s}
  .card[data-s=present]::before{background:var(--present)}.card[data-s=late]::before{background:var(--late)}
  .card[data-s=late_approved]::before{background:var(--late)}.card[data-s=absent]::before{background:var(--absent)}
  .card[data-s=absent_approved]::before{background:#f5a623}.card[data-s=none]::before{background:#dde3ea}
  .card:hover{border-color:#a8c4f0;box-shadow:0 6px 18px rgba(26,115,232,.12);transform:translateY(-1px)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .snum{font-family:'Space Mono',monospace;font-size:10px;color:#90a4ae;margin-bottom:2px}
  .sname{font-size:15px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .abtns{display:flex;gap:6px;flex-shrink:0}
  .ab{width:36px;height:36px;border-radius:8px;border:1px solid #dde3ea;background:#f8fafc;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .ab:hover{transform:scale(1.12);box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .ab.pb{border-color:#b8dfc9}.ab.lb{border-color:#f5d5a0}.ab.xb{border-color:#f5b8b8}
  .ab.on.pb{background:#e8f5ee;border-color:var(--present);box-shadow:0 0 8px rgba(30,158,87,.25)}
  .ab.on.lb{background:#fff3e0;border-color:var(--late);box-shadow:0 0 8px rgba(232,144,10,.25)}
  .ab.on.xb{background:#fde8e8;border-color:var(--absent);box-shadow:0 0 8px rgba(217,48,37,.25)}
  .note-row{margin-top:8px;border-top:1px dashed #e4eaf2;padding-top:7px;display:none}
  .note-row.visible{display:block}
  .note-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
  .ntag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
  .ntag.sched-late{background:#fff3e0;color:#b45309;border:1px solid #fcd34d}
  .ntag.sched-depart{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
  .ntag.sched-absent{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .ntag.sched-out{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .ntag.sched-special{background:#fdf4ff;color:#7e22ce;border:1px solid #e9d5ff}
  .ntag.sched-normal{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .ntag.extra-absent{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;font-weight:700}
  .ntag.extra-late{background:#fff3e0;color:#b45309;border:1px solid #fcd34d;font-weight:700}
  .note-full{font-size:11px;color:var(--muted);line-height:1.5;cursor:pointer}
  .note-full:hover{color:var(--accent)}
  .sched-banner{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff;padding:10px 32px;font-size:13px;display:none;align-items:center;gap:10px;flex-wrap:wrap}
  .sched-banner.show{display:flex}.sched-banner span{opacity:.85}
  .bbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  .pw{flex:1;min-width:180px;max-width:380px}
  .pl{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;justify-content:space-between}
  .pt{height:6px;background:#e8edf2;border-radius:3px;overflow:hidden;display:flex}
  .pf{height:100%;border-radius:3px;transition:width .3s ease}
  .pp{background:var(--present)}.lp{background:var(--late)}.ap{background:var(--absent)}
  .mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
  .mo.open{display:flex}
  .md{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:660px;max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .mt{font-size:17px;font-weight:700;color:var(--text)}
  .mc{width:30px;height:30px;border-radius:8px;background:#f0f4f8;border:1px solid var(--border);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;transition:all .2s}
  .mc:hover{background:#fde8e8;color:var(--absent);border-color:var(--absent)}
  .badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;font-family:'Space Mono',monospace}
  .bp{background:#e8f5ee;color:var(--present)}.bl{background:#fff3e0;color:var(--late)}.ba{background:#fde8e8;color:var(--absent)}
  .toast{position:fixed;bottom:82px;right:20px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:13px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:400;transform:translateY(16px);opacity:0;transition:all .3s;max-width:320px}
  .toast.show{transform:translateY(0);opacity:1}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);grid-column:1/-1}
  .note-detail-item{padding:10px 14px;border-radius:10px;border:1px solid var(--border);margin-bottom:8px;background:#fafbfd}
  .note-detail-label{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .note-detail-val{font-size:13px;color:var(--text);line-height:1.6}
  .dow-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:#e8f0fe;color:#1a73e8;margin-right:6px}
  .err-box{background:#fff;border:1px solid #f5b8b8;border-radius:16px;padding:28px 32px;text-align:center;max-width:420px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
  .err-box h3{font-size:17px;font-weight:700;color:var(--absent);margin-bottom:10px}
  .err-box p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}
  @media(max-width:600px){header,.toolbar,.stats,.content,.bbar{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr}.sc{min-width:100px}.sched-banner{padding:10px 14px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
  <div class="toast" id="toast"></div>
  <header>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="logo">📋</div>
      <div>
        <h1><span>ATTEND</span>ANCE</h1>
        <div style="font-size:11px;color:rgba(255,255,255,.6);margin-top:2px">김엄마독서실 7층 출결관리</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div class="sched-indicator" id="schedIndicator">📅 정기일정 로드됨</div>
      <div class="clock" id="clock"></div>
    </div>
  </header>
  <div class="sched-banner" id="schedBanner">
    <span>📅</span><span id="schedBannerTxt">정기일정이 적용되었습니다.</span>
    <button class="btn btn-dim" style="font-size:11px;padding:4px 10px;margin-left:auto" onclick="clearSchedule()">🗑 일정 초기화</button>
  </div>
  <div class="center" id="scLoad">
    <div class="spinner"></div>
    <div style="color:var(--muted);font-size:14px" id="loadMsg">구글 시트 연결 중...</div>
  </div>
  <div id="scMain" style="display:none">
    <div class="toolbar">
      <div class="tleft">
        <div class="dselector">
          <span>📅</span>
          <input type="date" id="dInput" onchange="changeDate()">
        </div>
        <button class="btn btn-green" onclick="setAll('present')">✅ 전체 출석</button>
        <label class="btn btn-excel" style="cursor:pointer">📂 출입기록 업로드<input type="file" id="xlsxInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleXlsx(this)"></label>
        <label class="btn btn-orange" style="cursor:pointer">📋 사유제출 업로드<input type="file" id="reasonInput" accept=".csv" style="display:none" onchange="handleReasonCsv(this)"></label>
        <label class="btn btn-sched" style="cursor:pointer">📅 정기일정 업로드<input type="file" id="schedInput" accept=".xlsx,.xls" style="display:none" onchange="handleScheduleXlsx(this)"></label>
        <button class="btn btn-dim" onclick="reload()">🔄 명단 새로고침</button>
      </div>
      <button class="btn btn-orange" onclick="openHist()">📜 출결 기록</button>
    </div>
    <div class="mo" id="xlsxMo">
      <div class="md" style="max-width:720px">
        <div class="mh"><div class="mt">📂 출입기록 분석 결과</div><button class="mc" onclick="closeXlsxMo()">✕</button></div>
        <div id="xlsxResult"></div>
        <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
          <button class="btn btn-dim" onclick="closeXlsxMo()">닫기</button>
          <button class="btn btn-primary" onclick="applyXlsx()">✅ 적용하기</button>
        </div>
      </div>
    </div>
    <div class="mo" id="reasonMo">
      <div class="md" style="max-width:720px">
        <div class="mh"><div class="mt">📋 사유제출 분석 결과</div><button class="mc" onclick="closeReasonMo()">✕</button></div>
        <div id="reasonResult"></div>
        <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
          <button class="btn btn-dim" onclick="closeReasonMo()">닫기</button>
          <button class="btn btn-primary" onclick="applyReason()">✅ 적용하기</button>
        </div>
      </div>
    </div>
    <div class="mo" id="noteMo">
      <div class="md" style="max-width:520px">
        <div class="mh"><div class="mt" id="noteMoTitle">📋 정기일정 상세</div><button class="mc" onclick="closeNoteMo()">✕</button></div>
        <div id="noteMoContent"></div>
      </div>
    </div>
    <div class="stats">
      <div class="sc t"><div class="sl">전체</div><div class="sv" id="sT">0</div></div>
      <div class="sc p"><div class="sl">✅ 출석</div><div class="sv" id="sP">0</div><div class="sp" id="sPp"></div></div>
      <div class="sc l"><div class="sl">⚠️ 지각</div><div class="sv" id="sL">0</div><div class="sp" id="sLp"></div></div>
      <div class="sc a"><div class="sl">❌ 결석</div><div class="sv" id="sA">0</div><div class="sp" id="sAp"></div></div>
      <div class="sc n"><div class="sl">⬜ 미확인</div><div class="sv" id="sN">0</div></div>
    </div>
    <div class="content">
      <div class="ch">
        <div class="ct">학생 목록 &nbsp;<b id="cnt">0명</b></div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <select id="filterSched" onchange="render()" style="background:#fff;border:1px solid var(--border);border-radius:9px;padding:7px 12px;color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;outline:none;cursor:pointer">
            <option value="all">전체 보기</option>
            <option value="hasnote">📅 일정있는 학생</option>
            <option value="late_sched">⚠️ 승인된 지각</option>
            <option value="absent_sched">❌ 승인된 결석</option>
            <option value="extra_today">📌 기타일정 해당</option>
          </select>
          <div class="sb"><input type="text" id="srch" placeholder="이름 검색..." oninput="render()"></div>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="bbar">
      <div class="pw">
        <div class="pl"><span>출결 현황</span><span id="pLabel">0 / 0</span></div>
        <div class="pt">
          <div class="pf pp" id="pgP" style="width:0%"></div>
          <div class="pf lp" id="pgL" style="width:0%"></div>
          <div class="pf ap" id="pgA" style="width:0%"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sheet" onclick="saveToSheet()" id="sheetBtn">☁️ 시트 저장</button>
        <button class="btn btn-blue" onclick="exportCSV()">💾 CSV 저장</button>
        <button class="btn btn-orange" onclick="exportSummary()">📋 요약 복사</button>
      </div>
    </div>
    <div class="mo" id="histMo">
      <div class="md">
        <div class="mh"><div class="mt">📜 날짜별 출결 기록</div><button class="mc" onclick="closeMo()">✕</button></div>
        <div id="histC"></div>
      </div>
    </div>
    <div style="height:76px"></div>
  </div>
</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxISj3ZgVnveVJvD87dd5pzADMbAd546I_MtPmkFS4xqdr6Z8dSXGWUslJ-jc-ONfJ_WA/exec';
const SK = 'att_7f';
const SK_SCHED = 'att_7f_sched';

let students=[], att={}, curDate=today(), xlsxParsed={};
let scheduleData = {};

function today(){ return new Date().toISOString().slice(0,10); }

(function tick(){
  const n=new Date(), el=document.getElementById('clock');
  if(el) el.textContent=n.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'})+' '+n.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  setTimeout(tick,1000);
})();

// ══════════════════════════════════════════════════
// ✅ 기타란 날짜 파싱 — 오늘 날짜에 해당하는 일정 추출
// ══════════════════════════════════════════════════
function parseExtraForDate(extraText, dateStr) {
  if (!extraText || !dateStr) return null;
  try {
    const parts = dateStr.split('-');
    const month = parseInt(parts[1]);
    const day   = parseInt(parts[2]);

    // 1. 같은 월 범위: 7월20-7월31일
    const sameMonthRange = new RegExp(month + '월\\s*(\\d{1,2})\\s*[-~]\\s*' + month + '월\\s*(\\d{1,2})일?', 'g');
    for (const m of extraText.matchAll(sameMonthRange)) {
      const s = parseInt(m[1]), e = parseInt(m[2]);
      if (s <= day && day <= e) {
        const after = extraText.slice(m.index + m[0].length, m.index + m[0].length + 30);
        const before = extraText.slice(Math.max(0, m.index - 10), m.index);
        return classifyExtraStatus(before + ' ' + after, extraText);
      }
    }

    // 2. 날짜 범위: 7/7-10, 7/7~10, 7월7~10일, 7월25일부터29일
    const rangePats = [
      new RegExp(month + '[/월\\.\\s]\\s*(\\d{1,2})일?부터?\\s*(\\d{1,2})일?', 'g'),
      new RegExp(month + '[/월\\.]\\s*(\\d{1,2})\\s*[-~]\\s*(\\d{1,2})[일]?', 'g'),
      new RegExp(month + '월\\s*(\\d{1,2})일?\\s*[-~]\\s*(\\d{1,2})일?', 'g'),
    ];
    for (const pat of rangePats) {
      for (const m of extraText.matchAll(pat)) {
        const s = parseInt(m[1]), e = parseInt(m[2]);
        if (s <= day && day <= e) {
          const after = extraText.slice(m.index + m[0].length, m.index + m[0].length + 30);
          const before = extraText.slice(Math.max(0, m.index - 10), m.index);
          return classifyExtraStatus(before + ' ' + after, extraText);
        }
      }
    }

    // 3. 콤마/공백 구분 날짜: 7/8,10,13 / 7월 8,9,10 / 7/11 7/17 7/25
    const commaPats = [
      new RegExp(month + '[/월\\.]\\s*(\\d{1,2}(?:\\s*[,、]\\s*\\d{1,2})+)', 'g'),
      new RegExp(month + '월\\s*(\\d{1,2}(?:\\s*[,、]\\s*\\d{1,2})+)', 'g'),
    ];
    for (const pat of commaPats) {
      for (const m of extraText.matchAll(pat)) {
        const nums = m[1].match(/\d+/g).map(Number);
        if (nums.includes(day)) {
          const after = extraText.slice(m.index + m[0].length, m.index + m[0].length + 30);
          const before = extraText.slice(Math.max(0, m.index - 10), m.index);
          return classifyExtraStatus(before + ' ' + after, extraText);
        }
      }
    }

    // 공백 구분: 7/11 7/17 7/25 결석
    const spacePat = new RegExp('((?:' + month + '[/월\\.]\\s*\\d{1,2}[일]?[\\s,]*)+)', 'g');
    for (const m of extraText.matchAll(spacePat)) {
      const nums = [...m[1].matchAll(/[/월\.]\s*(\d{1,2})/g)].map(x => parseInt(x[1]));
      if (nums.includes(day)) {
        const after = extraText.slice(m.index + m[0].length, m.index + m[0].length + 30);
        const before = extraText.slice(Math.max(0, m.index - 10), m.index);
        return classifyExtraStatus(before + ' ' + after, extraText);
      }
    }

    // 4. 단일 날짜: 7/9, 7월9일, 7.9, 7)결석
    const singlePats = [
      new RegExp(month + '[/\\.]0?' + day + '(?!\\d)', 'g'),
      new RegExp(month + '월\\s*0?' + day + '일', 'g'),
      new RegExp(month + '월\\s*0?' + day + '(?!\\d)', 'g'),
    ];
    for (const pat of singlePats) {
      const m = pat.exec(extraText);
      if (m) {
        const after = extraText.slice(m.index + m[0].length, m.index + m[0].length + 40);
        const before = extraText.slice(Math.max(0, m.index - 10), m.index);
        return classifyExtraStatus(before + ' ' + after, extraText);
      }
    }

    return null;
  } catch(e) { return null; }
}

function classifyExtraStatus(context, fullText) {
  if (context.includes('결석')) return { status: 'absent_approved', label: '사유결석', icon: '❌' };
  if (context.includes('지각')) {
    const tm = context.match(/(\d{1,2}시)/);
    const t = tm ? ' ' + tm[1] : '';
    return { status: 'late_approved', label: '사유지각' + t, icon: '⏰' };
  }
  if (context.includes('조퇴')) {
    const tm = context.match(/(\d{1,2}시)/);
    const t = tm ? ' ' + tm[1] : '';
    return { status: 'present', label: '조퇴' + t, icon: '🚪' };
  }
  if (context.includes('등원') || context.includes('하원')) {
    return { status: 'present', label: '특별일정', icon: '📌' };
  }
  return { status: 'present', label: '기타일정', icon: '📌' };
}

function applyExtraToday() {

function handleScheduleXlsx(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      const header = (rows[0]||[]).map(h=>String(h).trim());
      const nameIdx   = header.findIndex(h=>h==='이름'||h.includes('이름'));
      const monIdx    = header.findIndex(h=>h==='월요일'||h==='월');
      const tueIdx    = header.findIndex(h=>h==='화요일'||h==='화');
      const wedIdx    = header.findIndex(h=>h==='수요일'||h==='수');
      const thuIdx    = header.findIndex(h=>h==='목요일'||h==='목');
      const friIdx    = header.findIndex(h=>h==='금요일'||h==='금');
      const satIdx    = header.findIndex(h=>h==='토요일'||h==='토');
      const extraIdx  = header.findIndex(h=>h==='기타'||h.includes('기타'));
      const statusIdx = header.findIndex(h=>h.includes('승인'));
      if(nameIdx===-1){showToast('❌ 이름 컬럼을 찾을 수 없습니다');input.value='';return;}
      const parsed = {};
      for(let i=1;i<rows.length;i++){
        const row = rows[i];
        const name = String(row[nameIdx]||'').trim();
        if(!name) continue;
        const safeStr = (v, max=500) => String(v||'').trim().slice(0, max);
        parsed[name]={
          mon:safeStr(row[monIdx]), tue:safeStr(row[tueIdx]),
          wed:safeStr(row[wedIdx]), thu:safeStr(row[thuIdx]),
          fri:safeStr(row[friIdx]), sat:safeStr(row[satIdx]),
          extra:safeStr(row[extraIdx], 1000),
          approvalStatus:safeStr(row[statusIdx])
        };
      }
      scheduleData = parsed;
      localStorage.setItem(SK_SCHED, JSON.stringify(scheduleData));
      const cnt = Object.keys(scheduleData).length;
      showSchedBanner(`정기일정 ${cnt}명 적용됨`);
      document.getElementById('schedIndicator').classList.add('active');
      checkExtraBtn();
      render();
      showToast(`📅 정기일정 ${cnt}명 로드 완료!`);
    } catch(err){ showToast('❌ 파일 파싱 오류: '+err.message); }
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}

const DOW_KEY=['sun','mon','tue','wed','thu','fri','sat'];

function getScheduleForDate(studentName, dateStr){
  const entry=scheduleData[studentName]; if(!entry) return null;
  const dow=new Date(dateStr+'T00:00:00').getDay();
  const key=DOW_KEY[dow];
  if(key==='sun') return {dayText:entry.extra||'',extra:entry.extra||'',dow,key,approvalStatus:entry.approvalStatus};
  return {dayText:entry[key]||'',extra:entry.extra||'',dow,key,approvalStatus:entry.approvalStatus};
}

function parseNoteTags(schedInfo){
  if(!schedInfo) return [];
  const {dayText,approvalStatus}=schedInfo; const tags=[];
  if(!dayText||dayText.toLowerCase()==='nan') return tags;
  if(dayText.includes('결석')) tags.push({type:'sched-absent',icon:'❌',label:'결석 예정'});
  const lm=dayText.match(/지각\s*(\d{1,2}시(?:\d{1,2}분)?)/);
  if(lm) tags.push({type:'sched-late',icon:'⏰',label:'지각 '+lm[1]});
  else if(dayText.includes('지각')) tags.push({type:'sched-late',icon:'⏰',label:'지각 예정'});
  const dm=dayText.match(/조퇴\s*(\d{1,2}시(?:\d{1,2}분)?)/);
  if(dm) tags.push({type:'sched-depart',icon:'🚪',label:'조퇴 '+dm[1]});
  if(dayText.includes('외출')) tags.push({type:'sched-out',icon:'🚶',label:'외출 있음'});
  if(tags.length===0&&(dayText.includes('8시')||dayText.includes('등원 8'))) tags.push({type:'sched-normal',icon:'✅',label:'정상 등원'});
  if(approvalStatus&&approvalStatus.includes('승인')) tags.push({type:'sched-special',icon:'✓',label:approvalStatus});
  return tags;
}

async function reload(){ await loadStudents(); }

async function loadStudents(){
  show('scLoad'); hideMain(); setMsg('구글 시트 연결 중...');

  // 정기일정 복원
  const savedSched=localStorage.getItem(SK_SCHED);
  if(savedSched){
    try{ scheduleData=JSON.parse(savedSched); }catch(e){}
    if(Object.keys(scheduleData).length>0){
      showSchedBanner(`정기일정 ${Object.keys(scheduleData).length}명 복원됨`);
      document.getElementById('schedIndicator').classList.add('active');
    }
  }

  const backup=localStorage.getItem(SK+'_students');

  // 백업이 있으면 먼저 오프라인으로 앱 실행 (빠른 시작)
  if(backup){
    try{
      students=JSON.parse(backup);
      if(students.length>0){
        startApp();
        showToast('⏳ 저장된 명단으로 시작 중... 백그라운드에서 최신 명단 불러오는 중');
      }
    }catch(e){ students=[]; }
  }

  // 백그라운드에서 최신 명단 fetch (최대 3회 재시도)
  for(let attempt=1; attempt<=3; attempt++){
    try{
      if(students.length===0) setMsg(attempt>1 ? `재시도 중... (${attempt}/3)` : '구글 시트 연결 중...');
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(), 12000); // 12초로 늘림
      const res=await fetch(GAS_URL+'?t='+Date.now(), {signal:controller.signal}); // 캐시 방지
      clearTimeout(timeout);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const json=await res.json();
      if(json.status==='ok'&&Array.isArray(json.students)&&json.students.length>0){
        students=json.students.map((name,i)=>({id:'s'+i,num:String(i+1),name:name.toString().trim()})).filter(s=>s.name);
        localStorage.setItem(SK+'_students',JSON.stringify(students));
        startApp();
        showToast(`✅ ${students.length}명 불러왔습니다!`);
        return;
      }
      if(json.status==='ok'&&(!json.students||json.students.length===0)) throw new Error('명단이 비어있습니다 (구글 시트 확인 필요)');
      throw new Error(json.message||'알 수 없는 응답');
    } catch(e){
      const isTimeout=e.name==='AbortError';
      console.warn(`명단 로드 실패 (${attempt}회차):`, e.message);
      if(attempt<3){
        await new Promise(r=>setTimeout(r,2000)); // 2초 대기 후 재시도
        continue;
      }
      // 3회 모두 실패
      if(students.length>0){
        // 백업 명단으로 이미 실행 중이면 토스트만 (오류 화면 표시 안 함)
        showToast('⚠️ 최신 명단 불러오기 실패 — 저장된 명단으로 실행 중');
        hide('scLoad'); showMain(); // 로딩 화면 숨기고 메인 표시 유지
      } else {
        // 백업도 없을 때만 오류 화면 표시
        showError(`구글 시트 연결에 실패했습니다.<br><small style="color:#999">${isTimeout?'응답 시간 초과':e.message}</small><br><br><small style="color:#aaa">Apps Script 재배포 후 다시 시도해주세요.</small>`);
      }
    }
  }
}

function showError(msg){
  // 연결 실패 시 조용히 로딩 화면만 숨김 (오류 팝업 표시 안 함)
  const el = document.getElementById('scLoad');
  if(el) el.style.display = 'none';
  showToast('⚠️ 명단 연결 실패 — 🔄 명단 새로고침을 눌러주세요');
}
function setMsg(t){ const e=document.getElementById('loadMsg'); if(e) e.textContent=t; }

function startApp(){
  const saved=localStorage.getItem(SK);
  if(saved){ try{ att=JSON.parse(saved); }catch(e){ att={}; } }
  curDate=today();
  if(!att[curDate]) att[curDate]={};
  document.getElementById('dInput').value=curDate;
  hide('scLoad'); showMain(); checkExtraBtn(); render(); stats();
}

function render(){
  const q=(document.getElementById('srch').value||'').toLowerCase();
  const filterVal=document.getElementById('filterSched').value;
  const grid=document.getElementById('grid'); grid.innerHTML='';
  let f=students.filter(s=>s.name.toLowerCase().includes(q));
  if(filterVal!=='all'){
    f=f.filter(s=>{
      const si=getScheduleForDate(s.name,curDate);
      const entry=scheduleData[s.name];
      if(filterVal==='hasnote') return si&&si.dayText&&si.dayText.toLowerCase()!=='nan';
      if(filterVal==='late_sched') return si&&si.dayText&&si.dayText.includes('지각');
      if(filterVal==='absent_sched') return si&&si.dayText&&si.dayText.includes('결석');
      if(filterVal==='extra_today') return entry&&entry.extra&&!!parseExtraForDate(entry.extra,curDate);
      return true;
    });
  }
  document.getElementById('cnt').textContent=`${f.length}명`;
  if(!f.length){ grid.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:12px">🔍</div><div>검색 결과 없음</div></div>'; return; }

  f.forEach(s=>{
    const st=getSt(s.id), tm=getTime(s.id);
    const schedInfo=getScheduleForDate(s.name,curDate);
    const tags=parseNoteTags(schedInfo);
    const hasNote=schedInfo&&schedInfo.dayText&&schedInfo.dayText.toLowerCase()!=='nan';

    // ✅ 기타란 오늘 해당 일정
    const entry=scheduleData[s.name];
    const extraResult=entry&&entry.extra?parseExtraForDate(entry.extra,curDate):null;

    const d=document.createElement('div');
    d.className='card'; d.dataset.s=st; d.id='c'+s.id;

    let tagsHtml=tags.map(t=>`<span class="ntag ${t.type}">${t.icon} ${t.label}</span>`).join('');
    // 기타란 날짜 해당 태그 추가
    if(extraResult){
      const cls=extraResult.status==='absent_approved'?'extra-absent':'extra-late';
      tagsHtml+=`<span class="ntag ${cls}">📌 기타: ${extraResult.label}</span>`;
    }

    let noteTextHtml='';
    if(hasNote&&schedInfo.dayText){
      const short=schedInfo.dayText.length>40?schedInfo.dayText.slice(0,40)+'...':schedInfo.dayText;
      noteTextHtml=`<div class="note-full" onclick="openNoteMo('${s.name.replace(/'/g,'\\\'')}')">${short}</div>`;
    }
    // 기타란 전체 텍스트 요약 표시
    let extraHtml='';
    if(entry&&entry.extra&&extraResult){
      const short=entry.extra.length>50?entry.extra.slice(0,50)+'...':entry.extra;
      extraHtml=`<div class="note-full" style="color:#d97706;margin-top:2px" onclick="openNoteMo('${s.name.replace(/'/g,'\\\'')}')" title="기타 일정 전체 보기">📌 ${short}</div>`;
    } else if(schedInfo&&schedInfo.extra){
      const todayMentioned=checkExtraMention(schedInfo.extra,curDate);
      if(todayMentioned) extraHtml=`<div class="note-full" style="color:#d97706;margin-top:2px" onclick="openNoteMo('${s.name.replace(/'/g,'\\\'')}')" title="기타 일정">📌 ${todayMentioned}</div>`;
    }

    d.innerHTML=`
      <div class="card-top">
        <div style="flex:1;min-width:0">
          <div class="snum">No.${s.num}</div>
          <div class="sname">${s.name}</div>
          ${tm?`<div style="font-size:11px;color:var(--muted);margin-top:2px;font-family:'Space Mono',monospace">⏰ ${tm}</div>`:''}
          ${st==='late_approved'?`<div style="font-size:11px;color:#b45309;margin-top:2px">⏰ 사유지각</div>`:''}
          ${st==='absent_approved'?`<div style="font-size:11px;color:#f5a623;margin-top:2px">📋 사유결석</div>`:''}
        </div>
        <div class="abtns">
          <button class="ab pb ${st==='present'?'on':''}" onclick="setSt('${s.id}','present')" title="출석">✅</button>
          <button class="ab lb ${st==='late'||st==='late_approved'?'on':''}" onclick="setSt('${s.id}','late')" title="무단지각">⚠️</button>
          <button class="ab xb ${st==='absent'||st==='absent_approved'?'on':''}" onclick="setSt('${s.id}','absent')" title="무단결석">❌</button>
        </div>
      </div>
      ${(tagsHtml||noteTextHtml||extraHtml)?`
      <div class="note-row visible">
        ${tagsHtml?`<div class="note-tags">${tagsHtml}</div>`:''}
        ${noteTextHtml}${extraHtml}
      </div>`:''}`;
    grid.appendChild(d);
  });
}

function checkExtraMention(extraText,dateStr){
  if(!extraText) return null;
  const d=new Date(dateStr+'T00:00:00'), month=d.getMonth()+1, day=d.getDate();
  const patterns=[new RegExp(month+'\\/'+day+'[일]?\\s*[^,/]*'),new RegExp(month+'월\\s*'+day+'일?[^,/]*')];
  for(const p of patterns){ const m=extraText.match(p); if(m) return m[0].trim().slice(0,50); }
  return null;
}

function openNoteMo(name){
  const s=students.find(st=>st.name===name); if(!s) return;
  const entry=scheduleData[name]; if(!entry){ showToast('정기일정 없음'); return; }
  document.getElementById('noteMoTitle').textContent=`📋 ${name} — 정기일정`;
  const dow=new Date(curDate+'T00:00:00').getDay(), todayKey=DOW_KEY[dow];
  const days=[{key:'mon',label:'월요일'},{key:'tue',label:'화요일'},{key:'wed',label:'수요일'},{key:'thu',label:'목요일'},{key:'fri',label:'금요일'},{key:'sat',label:'토요일'}];
  let html='';
  days.forEach(d=>{
    const val=entry[d.key]; if(!val||val.toLowerCase()==='nan') return;
    const isToday=d.key===todayKey;
    html+=`<div class="note-detail-item" style="${isToday?'border-color:#1a73e8;background:#f0f7ff;':''}">
      <div class="note-detail-label"><span class="dow-badge" style="${isToday?'background:#1a73e8;color:#fff;':''}">${d.label}${isToday?' ← 오늘':''}</span></div>
      <div class="note-detail-val">${val}</div></div>`;
  });
  if(entry.extra){
    // 기타란에서 오늘 해당 일정 하이라이트
    const extraResult=parseExtraForDate(entry.extra,curDate);
    const extraStyle=extraResult?'border-color:#d97706;background:#fffbf0':'';

function handleXlsx(input){
  const file=input.files[0]; if(!file) return;
  const isCsv=file.name.toLowerCase().endsWith('.csv');
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      if(isCsv){
        const lines=e.target.result.split('\n'), enterRecords=[];
        for(let i=1;i<lines.length;i++){
          const line=lines[i].trim(); if(!line) continue;
          const cols=parseCSVLine(line); if(cols.length<7) continue;
          const dateStr=(cols[0]||'').trim(), device=(cols[4]||'').trim(), userStr=(cols[6]||'').trim(), event=(cols[8]||'').trim();
          if(!event.includes('authentication succeeded')||!device.includes('입문')) continue;
          const nameMatch=userStr.match(/\(([^)]+)\)/); if(!nameMatch) continue;
          let name=nameMatch[1].trim().replace(/\d+$/,'').trim(); if(!name) continue;
          const timeMatch=dateStr.match(/(\d{4}-\d{2}-\d{2})\s+(\d{2}):(\d{2})/); if(!timeMatch) continue;
          enterRecords.push({name,hour:parseInt(timeMatch[2]),min:parseInt(timeMatch[3]),timeStr:timeMatch[2]+':'+timeMatch[3]});
        }
        processEnterRecords(enterRecords);
      } else {
        const data=new Uint8Array(e.target.result), wb=XLSX.read(data,{type:'array',cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]], rows=XLSX.utils.sheet_to_json(ws,{header:1});
        const header=rows[0]||[];
        const timeIdx=header.findIndex(h=>String(h).includes('시간'));
        const nameIdx=header.findIndex(h=>String(h).includes('이름'));
        const dirIdx=header.findIndex(h=>String(h).includes('방향'));
        if(timeIdx===-1||nameIdx===-1){showToast('❌ 파일 형식 오류');input.value='';return;}
        const enterRecords=[];
        for(let i=1;i<rows.length;i++){
          const row=rows[i]; if(!row||!row[nameIdx]) continue;
          const name=String(row[nameIdx]).trim(); if(!name) continue;
          const dir=dirIdx>=0?String(row[dirIdx]||'').toUpperCase():'';
          if(dir&&dir!=='ENTER') continue;
          let timeVal=row[timeIdx],hour=25,min=0,isPM=false;
          if(timeVal instanceof Date){hour=timeVal.getHours();min=timeVal.getMinutes();}
          else if(typeof timeVal==='string'){
            isPM=timeVal.includes('오후')||timeVal.toLowerCase().includes('pm');
            const cleaned=timeVal.replace(/오전|오후|AM|PM/gi,'').trim();
            const m=cleaned.match(/(\d{1,2}):(\d{2})/);
            if(m){hour=parseInt(m[1]);min=parseInt(m[2]);if(isPM&&hour!==12)hour+=12;if(!isPM&&hour===12)hour=0;}
          } else if(typeof timeVal==='number'){
            const ts=Math.round(timeVal*86400);hour=Math.floor(ts/3600)%24;min=Math.floor((ts%3600)/60);
          }
          const timeStr=String(hour).padStart(2,'0')+':'+String(min).padStart(2,'0');
          enterRecords.push({name,hour,min,timeStr});
        }
        processEnterRecords(enterRecords);
      }
    } catch(err){ showToast('❌ 파일 파싱 오류: '+err.message); }
    input.value='';
  };
  isCsv?reader.readAsText(file,'UTF-8'):reader.readAsArrayBuffer(file);
}

function parseCSVLine(line){
  const result=[]; let cur='',inQuote=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){inQuote=!inQuote;}
    else if(ch===','&&!inQuote){result.push(cur);cur='';}
    else{cur+=ch;}
  }
  result.push(cur); return result;
}

function processEnterRecords(enterRecords){
  const normName=n=>n.replace(/\([^)]*\)/g,'').replace(/\s/g,'').trim();
  const firstEnter={};
  enterRecords.forEach(r=>{
    if(!firstEnter[r.name]||r.hour*60+r.min<firstEnter[r.name].hour*60+firstEnter[r.name].min) firstEnter[r.name]=r;
  });
  const present=[],late=[],absentSched=[],unmatched=[];
  Object.values(firstEnter).forEach(r=>{
    const student=students.find(s=>s.name===r.name)||students.find(s=>normName(s.name)===normName(r.name));
    if(!student){unmatched.push(r);return;}
    const si=getScheduleForDate(student.name,curDate), dayText=si?si.dayText:'';
    present.push({name:r.name,time:r.timeStr,note:dayText.includes('지각')?'승인지각':'출석'});
  });
  students.forEach(s=>{
    const hasRecord=Object.values(firstEnter).some(r=>r.name===s.name||normName(r.name)===normName(s.name));
    if(!hasRecord){
      const si=getScheduleForDate(s.name,curDate), dayText=si?si.dayText:'';
      if(dayText.includes('결석')) absentSched.push({name:s.name,note:'결석(승인)'});
    }
  });
  xlsxParsed={present,late,absentSched,unmatched,before8:present,after8:late};
  let html='';
  if(present.length) html+=`<div style="margin-bottom:16px"><div style="font-weight:700;color:var(--present);margin-bottom:8px">✅ 출석 — ${present.length}명</div><div style="display:flex;flex-wrap:wrap;gap:8px">${present.map(r=>`<span style="background:#e8f5ee;color:var(--present);border:1px solid #b8dfc9;border-radius:20px;padding:4px 12px;font-size:13px">${r.name} <span style="opacity:.7">${r.time}</span>${r.note==='승인지각'?' 📅':''}</span>`).join('')}</div></div>`;
  if(absentSched.length) html+=`<div style="margin-bottom:16px"><div style="font-weight:700;color:var(--absent);margin-bottom:8px">❌ 결석(승인) — ${absentSched.length}명</div><div style="display:flex;flex-wrap:wrap;gap:8px">${absentSched.map(r=>`<span style="background:#fde8e8;color:var(--absent);border:1px solid #f5b8b8;border-radius:20px;padding:4px 12px;font-size:13px">${r.name}</span>`).join('')}</div></div>`;
  if(unmatched.length) html+=`<div style="margin-bottom:16px"><div style="font-weight:700;color:var(--muted);margin-bottom:8px">❓ 명단 외 — ${unmatched.length}명</div><div style="display:flex;flex-wrap:wrap;gap:8px">${unmatched.map(r=>`<span style="background:#f0f4f8;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:13px">${r.name} <span style="opacity:.7">${r.time}</span></span>`).join('')}</div></div>`;
  if(!present.length&&!late.length) html='<div style="text-align:center;padding:30px;color:var(--muted)">📭 매칭된 학생이 없습니다</div>';
  document.getElementById('xlsxResult').innerHTML=html;
  document.getElementById('xlsxMo').classList.add('open');
}

function applyXlsx(){
  if(!xlsxParsed.present&&!xlsxParsed.before8) return;
  const d=new Date(curDate+'T00:00:00'); if(d.getDay()===0){showToast('일요일은 자율등원일입니다.');return;}
  att[curDate]={}; const normName=n=>n.replace(/\([^)]*\)/g,'').replace(/\s/g,'').trim(); let cntP=0,cntL=0,cntA=0;

async function saveToSheet(){
  const _d=new Date(curDate+'T00:00:00'); if(_d.getDay()===0){showToast('일요일은 저장하지 않습니다.');return;}

  // ✅ 저장 전 자동반영 (미확인 학생만, 이미 설정된 학생은 유지)
  if(!att[curDate]) att[curDate]={};
  let autoCnt=0;
  students.forEach(s=>{
    if(getSt(s.id)!=='none') return; // 이미 수동 설정된 학생은 건드리지 않음
    const entry=scheduleData[s.name];
    if(!entry) return;

    // 1순위: 기타란 날짜 파싱
    if(entry.extra){
      const result=parseExtraForDate(entry.extra,curDate);
      if(result){
        att[curDate][s.id]={status:result.status,time:''};
        autoCnt++; return;
      }
    }

    // 2순위: 요일별 정기일정으로 출결 결정
    const si=getScheduleForDate(s.name,curDate);
    const dayText=si?si.dayText:'';
    if(!dayText||dayText.toLowerCase()==='nan'||dayText.includes('자율')) return;

    if(dayText.includes('결석')){
      att[curDate][s.id]={status:'absent_approved',time:''};
      autoCnt++;
    } else {
      // ✅ 등원 시간 먼저 추출 (등원이 있으면 출석 우선)
      let timeStr='';
      const tmEnterBefore=dayText.match(/(\d{1,2})시(\d{0,2})분?\s*등원/);   // "8시 등원", "8시15분 등원"
      const tmEnterAfter=dayText.match(/등원\s*(\d{1,2})[시:]\s*(\d{0,2})/); // "등원8시", "등원8:00"
      const tmLateBefore=dayText.match(/(\d{1,2})시(\d{0,2})분?\s*지각/);    // "10시 지각", "9시30분 지각"
      const tmLateAfter=dayText.match(/지각\s*(\d{1,2})[시:]\s*(\d{0,2})/);  // "지각8시", "지각8:00"

      if(dayText.includes('등원')){
        // 출석: 등원 시간 추출
        if(tmEnterBefore){ const h=tmEnterBefore[1].padStart(2,'0'), m=(tmEnterBefore[2]||'00').padStart(2,'0'); timeStr=h+':'+m; }
        else if(tmEnterAfter){ const h=tmEnterAfter[1].padStart(2,'0'), m=(tmEnterAfter[2]||'00').padStart(2,'0'); timeStr=h+':'+m; }
        att[curDate][s.id]={status:'present',time:timeStr};
        autoCnt++;
      } else if(dayText.includes('지각')){
        // 지각: 지각 시간 추출
        if(tmLateBefore){ const h=tmLateBefore[1].padStart(2,'0'), m=(tmLateBefore[2]||'00').padStart(2,'0'); timeStr=h+':'+m; }
        else if(tmLateAfter){ const h=tmLateAfter[1].padStart(2,'0'), m=(tmLateAfter[2]||'00').padStart(2,'0'); timeStr=h+':'+m; }
        att[curDate][s.id]={status:'late_approved',time:timeStr};
        autoCnt++;
      } else if(dayText.includes('하원')||dayText.includes('조퇴')){
        att[curDate][s.id]={status:'present',time:''};
        autoCnt++;
      }
    }
  });
  if(autoCnt>0){ save(); render(); stats(); }

  const statusTextMap={'present':'출석','late':'무단지각','late_approved':'사유지각','absent':'무단결석','absent_approved':'사유결석','none':'미확인'};
  const statusColorMap={
    'present':{row:'#f0fff4',cell:'#c8f7d8',font:'#1e7e34'},'late':{row:'#fff8f0',cell:'#ffe0b2',font:'#e65100'},
    'late_approved':{row:'#fffde7',cell:'#fff3cd',font:'#856404'},'absent':{row:'#fff5f5',cell:'#ffd6d6',font:'#c0392b'},
    'absent_approved':{row:'#fff8ee',cell:'#f5d5a0',font:'#7a3800'},'none':{row:'#ffffff',cell:'#e0e0e0',font:'#555555'}
  };
  // ✅ 미확인 제외, 기타란 비고도 schedNote에 포함
  const records=students.map(s=>{
    const si=getScheduleForDate(s.name,curDate);
    const entry=scheduleData[s.name];
    const extraResult=entry&&entry.extra?parseExtraForDate(entry.extra,curDate):null;
    const st=getSt(s.id);
    const color=statusColorMap[st]||statusColorMap['none'];
    let schedNote=si?si.dayText:'';
    if(extraResult) schedNote=(schedNote?schedNote+' / ':'')+'[기타] '+extraResult.label;
    return {name:s.name,status:st,statusText:statusTextMap[st]||'미확인',time:getTime(s.id),schedNote,rowColor:color.row,cellColor:color.cell,fontColor:color.font};
  }).filter(r=>r.status!=='none');  // ✅ 미확인 제외

  const d=new Date(curDate+'T00:00:00'), sheetName=(d.getMonth()+1)+'월7층출결';
  const btn=document.getElementById('sheetBtn'); btn.disabled=true; btn.textContent='☁️ 저장 중...';
  try{
    const res=await fetch(GAS_URL.split('?')[0],{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveAttendance7f',date:curDate,floor:'7f',sheetName,records})});
    const json=await res.json();
    if(json.status==='ok') showToast('☁️ '+sheetName+' 시트에 저장됐습니다!');
    else throw new Error('저장 실패');
  }catch(e){ showToast('❌ 시트 저장 실패'); }
  finally{ btn.disabled=false; btn.textContent='☁️ 시트 저장'; }
}

function save(){ localStorage.setItem(SK,JSON.stringify(att)); }
function show(id){ document.getElementById(id).style.display='flex'; }
function hide(id){ document.getElementById(id).style.display='none'; }
function showMain(){ document.getElementById('scMain').style.display='block'; }
function hideMain(){ document.getElementById('scMain').style.display='none'; }
let tt;
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),3500); }

loadStudents();
</script>
